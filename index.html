<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slayerlabs</title>
    <link rel="stylesheet" href="app.css">
</head>
<body class="bg-[#121217] text-white">
    <header class="fixed top-0 inset-x-0 z-50 flex items-center justify-between px-6 py-4">
        <a href="/" class="transition hover:scale-105">
            <img src="https://assets.hackclub.com/flag-orpheus-top.svg" alt="Hack Club" class="w-32 drop-shadow-md">
        </a>
        <nav class="hidden md:flex items-center gap-6 px-6 py-2.5 rounded-full bg-white/10 backdrop-blur-md border border-white/15 text-sm font-medium text-white/90 shadow-xl">
            <a href="#projects" class="hover:text-white transition">Projects</a>
            <a href="#about" class="hover:text-white transition">About</a>
            <a href="#experiments" class="hover:text-white transition">Experiments</a>
            <a href="#labs" class="hover:text-white transition">Labs</a>
        </nav>
        <div>
            <a href="#projects" class="px-5 py-2.5 rounded-full bg-[#ec3750] hover:bg-[#4d0c15] text-white text-sm font-bold shadow-lg transition">
                View projects
            </a>
        </div>
    </header>
    <main class="relative min-h-screen flex flex-col items-center justify-center text-center px-6 pt-20 bg-cover bg-center" 
          style="background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=2000&q=80');">
        <h1 class="text-8xl font-display tracking-tight max-w-4xl leading-tight">
            Don't build alone.<br>
            Join us! <br> @ <span class="bg-hc-rainbow bg-clip-text text-transparent">slayerlabs</span>
        </h1>
        <p class="mt-6 text-hc-md text-white/80 max-w-2xl font-light">
            A workshop for software, experiments, and things worth building.
        </p>
        <div class="mt-8 flex flex-wrap gap-4 justify-center">
            <a href="#projects" class="px-7 py-3 rounded-full bg-[#ec3750] hover:bg-[#d92942] text-white font-bold text-lg hover:scale-105 transition shadow-lg">
                Explore builds &rarr;
            </a>
            <a href="#about" class="px-7 py-3 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold text-lg transition backdrop-blur-sm">
                About the lab
            </a>
        </div>
    </main>
    <section class="py-16 px-6 max-w-5xl mx-auto">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 p-6 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-sm">
            <div class="text-center p-4">
                <div class="text-4xl md:text-5xl font-display text-white">02</div>
                <div class="text-xs font-mono text-white/50 uppercase tracking-wider mt-2">Active Members</div>
            </div>
            <div class="text-center p-4 border-l border-white/10">
                <div class="text-4xl md:text-5xl font-display text-[#ec3750]">$0</div>
                <div class="text-xs font-mono text-white/50 uppercase tracking-wider mt-2">Outside Funding</div>
            </div>
            <div class="text-center p-4 border-l-0 md:border-l border-white/10">
                <div class="text-4xl md:text-5xl font-display text-[#33d6a6]">100%</div>
                <div class="text-xs font-mono text-white/50 uppercase tracking-wider mt-2">Open Source</div>
            </div>
            <div class="text-center p-4 border-l border-white/10">
                <div class="text-4xl md:text-5xl font-display text-yellow-400">&infin;</div>
                <div class="text-xs font-mono text-white/50 uppercase tracking-wider mt-2">Unfinished Builds</div>
            </div>
        </div>
    </section>
</body>
</html>
